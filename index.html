<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      (() => {
        try {
          if (sessionStorage.getItem("procureguard_dark_mode") === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            const theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", "#080a12");
          }
        } catch {
          /* Session storage can be unavailable in hardened browser modes. */
        }
      })();
    </script>
    <meta
      name="description"
      content="ProcureGuard AI helps procurement and accounts payable teams identify invoices to hold, review evidence, prepare approval-ready follow-up work, and preserve an audit trail before payment release."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ProcureGuard AI — Payment Control for Procurement Teams" />
    <meta
      property="og:description"
      content="Identify payment exceptions, review receipt evidence, prepare approval-ready follow-up work, and keep the audit trail intact before invoices are released."
    />
    <meta property="og:site_name" content="ProcureGuard AI" />
