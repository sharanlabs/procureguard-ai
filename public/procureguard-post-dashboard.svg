<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="ProcureGuard AI dashboard showcase">
  <defs>
    <linearGradient id="page" x1="260" y1="0" x2="2140" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F4F0E7"/>
    </linearGradient>
    <linearGradient id="brand" x1="79" y1="58" x2="141" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D9AFF"/>
      <stop offset="0.56" stop-color="#6571F2"/>
      <stop offset="1" stop-color="#4E56D4"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7483FF"/>
      <stop offset="1" stop-color="#4F5CE2"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-18%" width="120%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1D243A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1D243A" flood-opacity="0.08"/>
    </filter>
    <filter id="softBlue" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#5A67E8" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Geist", sans-serif; }
      .serif { font-family: "Newsreader", Georgia, serif; }
      .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
      .ink { fill: #0F1011; }
      .muted { fill: #5B6170; }
      .faint { fill: #8B90A0; }
      .rule { stroke: #DDD6C8; }
      .soft-rule { stroke: #E9E3D7; }
      .panel { fill: #FFFDF9; stroke: #DED7C9; }
      .soft-panel { fill: #F8F6F1; stroke: #E7E0D3; }
      .label { font-size: 18px; letter-spacing: 4px; font-weight: 600; }
      .body { font-size: 23px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; letter-spacing: 2px; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

