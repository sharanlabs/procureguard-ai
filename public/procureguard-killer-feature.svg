    <text x="36" y="62" class="mono" fill="#626A78" font-size="16" letter-spacing="4">AI-PREPARED WORK</text>
    <text x="36" y="148" class="serif num" fill="#0F1011" font-size="118" letter-spacing="-5">13</text>
    <text x="210" y="114" class="sans" fill="#0F1011" font-size="42" font-weight="780">drafts ready</text>
    <text x="210" y="158" class="sans" fill="#303642" font-size="24">for human review</text>
    <line x1="36" y1="210" x2="594" y2="210" stroke="#ECE6DA"/>
    <g transform="translate(36 242)">
