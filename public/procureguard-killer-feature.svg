  <g transform="translate(84 1074)" filter="url(#smallShadow)">
    <rect width="630" height="190" rx="24" fill="#0F1011"/>
    <text x="34" y="56" class="mono" fill="#C4CAD7" font-size="15" letter-spacing="3">PUBLIC CLAIM</text>
    <text x="34" y="104" class="sans" fill="#FFFDF8" font-size="32" font-weight="780">No send capability.</text>
    <text x="34" y="146" class="sans" fill="#D6DAE3" font-size="22">The product drafts and explains. The human decides.</text>
