    <text y="92" class="serif" fill="#0F1011" font-size="104" letter-spacing="-4">AI prepares the work.</text>
    <text y="198" class="serif" fill="#0F1011" font-size="104" letter-spacing="-4">Humans approve the release.</text>
    <text y="268" class="sans" fill="#303642" font-size="30">
      <tspan x="0" dy="0">Thirteen review items are drafted from invoice evidence,</tspan>
      <tspan x="0" dy="42">held as DRAFT-only, and tied to a complete audit trail.</tspan>
    </text>
  </g>

