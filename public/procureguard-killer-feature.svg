      <text x="48" y="25" class="mono" fill="#D93A34" font-size="15">Escalation</text>
      <text x="188" y="25" class="sans" fill="#0F1011" font-size="21" font-weight="760">4 memos</text>
    </g>
    <g transform="translate(36 302)">
      <rect width="160" height="38" rx="19" fill="#FFF7EA" stroke="#C77708"/>
      <text x="50" y="25" class="mono" fill="#C77708" font-size="15">Follow-up</text>
      <text x="188" y="25" class="sans" fill="#0F1011" font-size="21" font-weight="760">7 supplier requests</text>
    </g>
    <g transform="translate(36 362)">
      <rect width="160" height="38" rx="19" fill="#F7F5EF" stroke="#DED7C9"/>
      <text x="56" y="25" class="mono" fill="#626A78" font-size="15">Approval</text>
      <text x="188" y="25" class="sans" fill="#0F1011" font-size="21" font-weight="760">2 procurement approvals</text>
    </g>
  </g>

