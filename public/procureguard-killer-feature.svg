      <rect x="22" y="14" width="150" height="30" rx="15" fill="#FFF2F2" stroke="#D93A34"/>
      <text x="62" y="34" class="mono" fill="#D93A34" font-size="15">Escalation</text>
      <text x="196" y="35" class="mono" fill="#0F1011" font-size="16">T3</text>
      <text x="270" y="35" class="mono" fill="#0F1011" font-size="16">INV-0011</text>
      <text x="410" y="35" class="sans" fill="#0F1011" font-size="20">Invoice Quantity Exceeds PO Authorization</text>
      <text x="1130" y="35" class="sans" fill="#303642" font-size="18">Apex Industrial</text>
      <text x="1435" y="35" text-anchor="end" class="mono num" fill="#0F1011" font-size="18">$1,020.00</text>
    </g>
    <g transform="translate(34 242)">
      <rect width="1488" height="58" rx="16" fill="#FFFDF9" stroke="#ECE6DA"/>
      <rect x="22" y="14" width="150" height="30" rx="15" fill="#FFF2F2" stroke="#D93A34"/>
      <text x="62" y="34" class="mono" fill="#D93A34" font-size="15">Escalation</text>
      <text x="196" y="35" class="mono" fill="#0F1011" font-size="16">T3</text>
      <text x="270" y="35" class="mono" fill="#0F1011" font-size="16">INV-0024</text>
      <text x="410" y="35" class="sans" fill="#0F1011" font-size="20">Invalid PO Reference / Maverick Spend</text>
      <text x="1130" y="35" class="sans" fill="#303642" font-size="18">TransLogix Shipping</text>
      <text x="1435" y="35" text-anchor="end" class="mono num" fill="#0F1011" font-size="18">$568.75</text>
    </g>
    <g transform="translate(34 316)">
      <rect width="1488" height="58" rx="16" fill="#FFFDF9" stroke="#ECE6DA"/>
      <rect x="22" y="14" width="150" height="30" rx="15" fill="#FFF7EA" stroke="#C77708"/>
      <text x="62" y="34" class="mono" fill="#C77708" font-size="15">Follow-up</text>
      <text x="196" y="35" class="mono" fill="#0F1011" font-size="16">T2</text>
      <text x="270" y="35" class="mono" fill="#0F1011" font-size="16">INV-0016</text>
      <text x="410" y="35" class="sans" fill="#0F1011" font-size="20">Unit Price Variance</text>
      <text x="1130" y="35" class="sans" fill="#303642" font-size="18">Vanguard Tools</text>
      <text x="1435" y="35" text-anchor="end" class="mono num" fill="#0F1011" font-size="18">$296.00</text>
    </g>

    <g transform="translate(34 430)">
      <rect width="690" height="238" rx="22" fill="#F8F6F1" stroke="#DED7C9"/>
      <text x="28" y="48" class="mono" fill="#626A78" font-size="14" letter-spacing="3">EVIDENCE LENS</text>
      <text x="28" y="94" class="mono num" fill="#0F1011" font-size="34" letter-spacing="4">INV-0011</text>
      <text x="28" y="126" class="sans" fill="#303642" font-size="18">Apex Industrial · Tier 3 hold</text>
      <line x1="28" y1="156" x2="662" y2="156" stroke="#DED7C9"/>
      <text x="28" y="194" class="mono" fill="#626A78" font-size="13">PO</text>
      <text x="122" y="194" class="mono num" fill="#0F1011" font-size="20">100 units</text>
      <text x="292" y="194" class="mono" fill="#626A78" font-size="13">RECEIPT</text>
      <text x="416" y="194" class="mono num" fill="#0F1011" font-size="20">100 accepted</text>
      <text x="28" y="224" class="mono" fill="#626A78" font-size="13">INVOICE</text>
      <text x="122" y="224" class="mono num" fill="#0F1011" font-size="20">120 billed</text>
      <rect x="420" y="204" width="214" height="32" rx="16" fill="#FFF2F2" stroke="#D93A34"/>
      <text x="456" y="226" class="mono" fill="#D93A34" font-size="14">Hold before release</text>
    </g>

    <g transform="translate(768 430)">
      <rect width="690" height="238" rx="22" fill="#F8F6F1" stroke="#DED7C9"/>
      <text x="28" y="48" class="mono" fill="#626A78" font-size="14" letter-spacing="3">AUDIT TRACE</text>
      <text x="28" y="92" class="sans" fill="#0F1011" font-size="28" font-weight="780">Prepared, not sent</text>
      <line x1="84" y1="146" x2="600" y2="146" stroke="#23A86E" stroke-width="3"/>
      <g transform="translate(84 112)">
        <circle cx="0" cy="34" r="34" fill="#F1FBF6" stroke="#23A86E" stroke-width="3"/>
        <text x="0" y="92" text-anchor="middle" class="sans" fill="#0F1011" font-size="16" font-weight="740">Evidence</text>
      </g>
      <g transform="translate(342 112)">
        <circle cx="0" cy="34" r="34" fill="#F8F4FF" stroke="#6571F2" stroke-width="3"/>
        <text x="0" y="92" text-anchor="middle" class="sans" fill="#0F1011" font-size="16" font-weight="740">Draft</text>
      </g>
      <g transform="translate(600 112)">
        <circle cx="0" cy="34" r="34" fill="#F1FBF6" stroke="#23A86E" stroke-width="3"/>
        <text x="0" y="92" text-anchor="middle" class="sans" fill="#0F1011" font-size="16" font-weight="740">Review</text>
      </g>
