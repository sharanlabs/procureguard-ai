<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-label="ProcureGuard AI killer feature showcase: AI-prepared DRAFT-only follow-ups backed by invoice evidence and audit trace">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="2400" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F3EFE6"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8D9AFF"/>
      <stop offset=".56" stop-color="#6571F2"/>
      <stop offset="1" stop-color="#4E56D4"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7584FF"/>
      <stop offset="1" stop-color="#515BDD"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-16%" width="116%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#1D243A" flood-opacity=".12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D243A" flood-opacity=".08"/>
    </filter>
    <filter id="smallShadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1D243A" flood-opacity=".10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1D243A" flood-opacity=".08"/>
    </filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Geist",Arial,sans-serif}
      .serif{font-family:"Newsreader",Georgia,serif}
      .mono{font-family:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace}
      .num{font-variant-numeric:tabular-nums}
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#page)"/>
  <rect x="40" y="38" width="2320" height="1274" rx="52" fill="rgba(255,255,255,.58)" stroke="#DED7C9"/>

  <g transform="translate(84 72)">
    <rect width="62" height="62" rx="18" fill="#F5F6FF"/>
    <rect x="10" y="10" width="42" height="42" rx="12" fill="url(#brand)"/>
    <path d="M31 18 45 23v13c0 11-5.5 18-14 22-8.5-4-14-11-14-22V23l14-5Z" fill="#fff"/>
    <path d="m25 35 5 5 13-15" fill="none" stroke="#6571F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="30" class="sans" fill="#0F1011" font-size="30" font-weight="760" letter-spacing="-0.5">ProcureGuard AI</text>
    <text x="84" y="60" class="mono" fill="#626A78" font-size="15" letter-spacing="2.4">Payment Control</text>
  </g>

  <g transform="translate(1140 76)" filter="url(#smallShadow)">
    <rect width="610" height="58" rx="21" fill="#FFFDF9" stroke="#DED7C9"/>
    <circle cx="36" cy="29" r="7" fill="#23A86E"/>
    <text x="56" y="35" class="mono" fill="#0F1011" font-size="15" letter-spacing="1.7">Run complete · DRAFT-only</text>
    <line x1="342" y1="14" x2="342" y2="44" stroke="#DED7C9"/>
    <text x="370" y="35" class="mono" fill="#626A78" font-size="15" letter-spacing="1.5">25 invoices checked</text>
  </g>

  <g transform="translate(84 208)">
